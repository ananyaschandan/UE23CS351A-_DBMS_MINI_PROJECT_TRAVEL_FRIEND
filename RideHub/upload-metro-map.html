<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Metro Map to BLOB Storage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }
        
        .file-input-label {
            display: block;
            padding: 12px 15px;
            background: #f5f5f5;
            border: 2px dashed #ccc;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .file-input-label:hover {
            background: #efefef;
            border-color: #667eea;
        }
        
        .file-input-label.has-file {
            background: #e8f0fe;
            border-color: #667eea;
            color: #667eea;
        }
        
        .upload-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .upload-btn:active {
            transform: translateY(0);
        }
        
        .upload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .result.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result.success {
            background: #d1fae5;
            border: 2px solid #10b981;
            color: #065f46;
        }
        
        .result.error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
        }
        
        .result h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .result p {
            margin: 5px 0;
            font-size: 14px;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .info-box {
            background: #f0f9ff;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }
        
        .info-box h3 {
            color: #1e40af;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .info-box p {
            color: #1e40af;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            margin-top: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚇 Upload Metro Map</h1>
        <p class="subtitle">Store Bangalore Metro map in database BLOB storage</p>
        
        <div class="info-box">
            <h3>ℹ️ Information</h3>
            <p>This tool uploads the metro map image directly to the MySQL database as a BLOB. The image will be available in the Metro Route Finder page.</p>
        </div>
        
        <form id="uploadForm">
            <div class="form-group">
                <label for="mapName">Map Name:</label>
                <input 
                    type="text" 
                    id="mapName" 
                    value="Bangalore Metro Network Map" 
                    required
                    placeholder="Enter map name"
                >
            </div>
            
            <div class="form-group">
                <label for="mapDescription">Description:</label>
                <textarea 
                    id="mapDescription" 
                    placeholder="Enter map description"
                >Official Bangalore Metro Route Map with Purple, Green, and Pink lines showing all stations and interchanges.</textarea>
            </div>
            
            <div class="form-group">
                <label for="mapImage">Select Metro Map Image:</label>
                <div class="file-input-wrapper">
                    <input 
                        type="file" 
                        id="mapImage" 
                        accept="image/*" 
                        required
                    >
                    <label for="mapImage" class="file-input-label" id="fileLabel">
                        📁 Click to select image file (PNG, JPG, etc.)
                    </label>
                </div>
                <div id="imagePreview"></div>
            </div>
            
            <button type="submit" class="upload-btn" id="uploadBtn">
                Upload to Database
            </button>
        </form>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        const fileInput = document.getElementById('mapImage');
        const fileLabel = document.getElementById('fileLabel');
        const imagePreview = document.getElementById('imagePreview');
        const uploadForm = document.getElementById('uploadForm');
        const uploadBtn = document.getElementById('uploadBtn');
        const resultDiv = document.getElementById('result');

        // File selection preview
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileLabel.classList.add('has-file');
                fileLabel.innerHTML = `✅ ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
                
                // Show image preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.innerHTML = `<img src="${e.target.result}" class="preview-image" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Form submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('mapImage', fileInput.files[0]);
            formData.append('mapName', document.getElementById('mapName').value);
            formData.append('mapDescription', document.getElementById('mapDescription').value);
            
            // Show loading state
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<span class="loading"></span>Uploading to database...';
            resultDiv.classList.remove('show', 'success', 'error');
            
            try {
                const response = await fetch('http://localhost:5000/api/metro/upload-map', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.className = 'result success show';
                    resultDiv.innerHTML = `
                        <h3>✅ Upload Successful!</h3>
                        <p><strong>Map ID:</strong> ${data.mapId}</p>
                        <p><strong>File Size:</strong> ${(data.size / 1024).toFixed(2)} KB</p>
                        <p><strong>Status:</strong> Image stored in database as BLOB</p>
                        <p style="margin-top: 10px;">The metro map is now available in the Metro Route Finder page!</p>
                    `;
                    
                    // Reset form after 3 seconds
                    setTimeout(() => {
                        uploadForm.reset();
                        fileLabel.classList.remove('has-file');
                        fileLabel.innerHTML = '📁 Click to select image file (PNG, JPG, etc.)';
                        imagePreview.innerHTML = '';
                    }, 3000);
                } else {
                    resultDiv.className = 'result error show';
                    resultDiv.innerHTML = `
                        <h3>❌ Upload Failed</h3>
                        <p><strong>Error:</strong> ${data.error}</p>
                        <p>Please check the server console for more details.</p>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error show';
                resultDiv.innerHTML = `
                    <h3>❌ Connection Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>Make sure the backend server is running on port 5000.</p>
                `;
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = 'Upload to Database';
            }
        });
    </script>
</body>
</html>
